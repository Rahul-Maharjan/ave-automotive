<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Default metadata. Every page overrides the title/description/canonical and
      Open Graph tags at runtime via the <Seo> component (React Helmet). These
      values act as the fallback for crawlers that do not execute JavaScript.
    -->
    <title>AVE Automotives | Premium Auto Parts, Lubricants &amp; Accessories in Nepal</title>
    <meta
      name="description"
      content="AVE Automotives supplies genuine car parts, high-performance lubricants, and accessories in Nepal. Browse tires, engine parts, brake systems, and more with expert guidance."
    />
    <meta
      name="keywords"
      content="auto parts Nepal, car parts Kathmandu, automotive accessories, engine parts, car lubricants, tires and wheels, brake system, AVE Automotives"
    />
    <meta name="author" content="AVE Automotives" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1"
    />
    <link rel="canonical" href="https://aveautomotive.com.np/new/" />

    <!-- Open Graph defaults -->
    <meta property="og:site_name" content="AVE Automotives" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="AVE Automotives | Premium Auto Parts, Lubricants &amp; Accessories in Nepal"
    />
    <meta
      property="og:description"
      content="AVE Automotives supplies genuine car parts, high-performance lubricants, and accessories in Nepal. Browse tires, engine parts, brake systems, and more with expert guidance."
    />
    <meta property="og:url" content="https://aveautomotive.com.np/new/" />
    <meta
      property="og:image"
      content="https://aveautomotive.com.np/new/android-chrome-512x512.png"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AVE Automotives | Premium Auto Parts, Lubricants &amp; Accessories in Nepal"
    />
    <meta
      name="twitter:description"
      content="AVE Automotives supplies genuine car parts, high-performance lubricants, and accessories in Nepal. Browse tires, engine parts, brake systems, and more with expert guidance."
    />
    <meta
      name="twitter:image"
      content="https://aveautomotive.com.np/new/android-chrome-512x512.png"
    />
  </head>
